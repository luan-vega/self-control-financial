# Perfil de produção: SPRING_PROFILES_ACTIVE=prod (ver docs/deployment.md).
# Todos os segredos vêm de variáveis de ambiente; nada sensível fica neste arquivo.

# HTTPS obrigatório (o TLS termina no ingress/proxy; X-Forwarded-Proto diz o protocolo original)
app.security.require-https=${REQUIRE_HTTPS:true}
server.servlet.session.cookie.secure=true

# Logs em JSON (Elastic Common Schema) para o agregador de logs
logging.structured.format.console=ecs
logging.structured.ecs.service.name=self-control-financial
logging.level.root=INFO
logging.level.http.access=INFO

# Health detalhado só para quem está autenticado; as probes do Kubernetes usam /actuator/health/{liveness,readiness}
management.endpoint.health.show-details=when-authorized
management.endpoint.health.group.readiness.include=readinessState,db

# Desligamento gracioso: termina as requisições em andamento antes de parar o pod
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Pool de conexões com o banco (ajuste conforme réplicas x max_connections do Postgres)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Swagger UI: deixe em produção (a API é pública), mas sem "try it out" com credenciais salvas
springdoc.swagger-ui.persist-authorization=false
