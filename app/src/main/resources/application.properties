spring.application.name=self-control-financial

# Banco (sobrescreva por variáveis de ambiente em produção)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/selfcontrol}
spring.datasource.username=${DB_USER:selfcontrol}
spring.datasource.password=${DB_PASSWORD:selfcontrol}

# Flyway: migrations só para frente, nunca editar uma já aplicada
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

spring.jooq.sql-dialect=postgres

# Sessão no banco (tabelas criadas pelo Flyway, não pelo Spring Session)
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

# Atrás de proxy reverso (HTTPS terminado fora da app)
server.forward-headers-strategy=framework
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Mensagens de validação e formatos sempre em pt-BR
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Recusa subir se o usuário do banco ignorar RLS (superusuário/BYPASSRLS)
app.rls.require-enforced=true

# Importação de extratos (OFX/CSV): até 5 MB por arquivo
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Fase 3: uso comercial -------------------------------------------------------------
# URL pública da app (links de e-mail e retorno do Stripe). Em produção, sempre defina.
app.public-url=${APP_PUBLIC_URL:}
# E-mails que viram admin (separados por vírgula)
app.admin.emails=${ADMIN_EMAILS:}
# HTTPS obrigatório (o perfil prod liga)
app.security.require-https=${REQUIRE_HTTPS:false}

# API pública /api/v1
app.api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Client ids do Google aceitos como audiência do ID token (apps nativos), separados por vírgula
app.api.google-client-ids=${API_GOOGLE_CLIENT_IDS:}
app.rate-limit.api-per-minute=${RATE_LIMIT_API_PER_MINUTE:100}
app.rate-limit.ip-per-minute=${RATE_LIMIT_IP_PER_MINUTE:300}
app.rate-limit.webhook-per-minute=60
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:10}

# Documentação OpenAPI: só a API pública, Swagger UI em /docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.paths-to-match=/api/v1/**
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=false

# Cobrança: mock (padrão, checkout simulado) ou stripe
app.billing.provider=${BILLING_PROVIDER:mock}
app.billing.pro-price-label=${BILLING_PRO_PRICE_LABEL:R$ 9,90/m\u00eas}
app.billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.billing.stripe.price-id=${STRIPE_PRICE_ID:}
app.billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Cache de relatórios (em memória, por instância)
app.reports.cache.enabled=true
app.reports.cache.ttl=10m
app.reports.cache.max-entries=10000

# Versão exibida na documentação da API
app.version=@project.version@

# Threads virtuais (Java 21+): cada requisição bloqueante custa pouco
spring.threads.virtual.enabled=true
