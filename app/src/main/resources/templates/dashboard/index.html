<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Início</title>
</head>
<body>
<main layout:fragment="content" class="flex-1 px-4 pb-28 safe-top">
    <header class="flex items-center justify-between pt-6 pb-4">
        <div>
            <p class="text-sm text-slate-500">Olá,</p>
            <h1 class="text-xl font-semibold" th:text="${#authentication.name}">usuário</h1>
        </div>
        <span class="rounded-full bg-amber-100 px-2.5 py-1 text-xs font-medium text-amber-800 dark:bg-amber-900/40 dark:text-amber-200">
            Dados de exemplo
        </span>
    </header>

    <section id="summary" th:fragment="summary" class="space-y-5">
        <!-- Troca de mês via HTMX: o servidor devolve só este fragmento -->
        <div class="flex items-center justify-between">
            <button type="button" class="grid size-9 place-items-center rounded-full text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-800"
                    aria-label="Mês anterior"
                    th:attr="hx-get=@{/(month=${view.month.minusMonths(1)})}"
                    hx-target="#summary" hx-swap="outerHTML" hx-push-url="true">
                <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <h2 class="font-medium" th:text="${@fmt.month(view.month)}">Outubro de 2026</h2>
            <button type="button" class="grid size-9 place-items-center rounded-full text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-800"
                    aria-label="Próximo mês"
                    th:attr="hx-get=@{/(month=${view.month.plusMonths(1)})}"
                    hx-target="#summary" hx-swap="outerHTML" hx-push-url="true">
                <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
            </button>
        </div>

        <!-- Saldo do mês -->
        <div class="rounded-3xl bg-brand-700 p-5 text-white shadow-lg shadow-brand-700/20">
            <p class="text-sm text-white/80">Saldo do mês</p>
            <p class="money mt-1 text-3xl font-semibold tracking-tight" th:text="${@fmt.money(view.balance.net())}">R$ 0,00</p>
            <div class="mt-5 grid grid-cols-2 gap-3 text-sm">
                <div class="rounded-2xl bg-white/15 p-3">
                    <p class="text-white/80">Receitas</p>
                    <p class="money mt-0.5 font-semibold" th:text="${@fmt.money(view.balance.income())}">R$ 0,00</p>
                </div>
                <div class="rounded-2xl bg-white/15 p-3">
                    <p class="text-white/80">Despesas</p>
                    <p class="money mt-0.5 font-semibold" th:text="${@fmt.money(view.balance.expenses())}">R$ 0,00</p>
                </div>
            </div>
        </div>

        <!-- Para onde foi o dinheiro -->
        <div class="rounded-3xl bg-white p-5 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
            <h3 class="font-medium">Maiores gastos</h3>
            <ul class="mt-4 space-y-3">
                <li th:each="c : ${view.topExpenses}">
                    <div class="flex justify-between text-sm">
                        <span th:text="${c.category}">Moradia</span>
                        <span class="money text-slate-600 dark:text-slate-300" th:text="${@fmt.money(c.total)}">R$ 0,00</span>
                    </div>
                    <div class="mt-1.5 h-2 rounded-full bg-slate-100 dark:bg-slate-800">
                        <div class="h-2 rounded-full bg-brand-500" th:style="|width: ${c.share}%|"></div>
                    </div>
                </li>
            </ul>
        </div>

        <!-- Últimos lançamentos -->
        <div class="rounded-3xl bg-white p-5 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
            <div class="flex items-center justify-between">
                <h3 class="font-medium">Últimos lançamentos</h3>
                <a href="#" class="text-sm font-medium text-brand-600">Ver todos</a>
            </div>
            <ul class="mt-2 divide-y divide-slate-100 dark:divide-slate-800">
                <li th:each="e : ${view.recent}" class="flex items-center gap-3 py-3">
                    <span class="grid size-10 shrink-0 place-items-center rounded-full text-sm font-semibold"
                          th:classappend="${e.type.name() == 'INCOME'} ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'"
                          th:text="${#strings.substring(e.category, 0, 1)}">M</span>
                    <div class="min-w-0 flex-1">
                        <p class="truncate text-sm font-medium" th:text="${e.description}">Descrição</p>
                        <p class="text-xs text-slate-500" th:text="|${e.category} · ${@fmt.day(e.date)}|">Categoria · 01 out</p>
                    </div>
                    <span class="money text-sm font-semibold"
                          th:classappend="${e.type.name() == 'INCOME'} ? 'text-income' : 'text-slate-900 dark:text-slate-100'"
                          th:text="${e.type.name() == 'INCOME'} ? |+ ${@fmt.money(e.amount)}| : |- ${@fmt.money(e.amount)}|">R$ 0,00</span>
                </li>
            </ul>
        </div>
    </section>
</main>
</body>
</html>
