<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Histórico de imports</title>
</head>
<body>
<main layout:fragment="content" class="flex-1 px-4 pb-28 safe-top">
    <header class="pt-6 pb-4">
        <h1 class="text-xl font-semibold">Histórico de imports</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400">Cada arquivo enviado, quando e o que aconteceu com as linhas.</p>
    </header>

    <div th:replace="~{fragments/automation :: tabs('history')}"></div>

    <div th:if="${#lists.isEmpty(batches)}" class="rounded-3xl bg-white p-8 text-center text-sm shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
        <p class="text-slate-500 dark:text-slate-400">Nenhum arquivo importado ainda.</p>
        <a th:href="@{/imports/new}" class="mt-3 inline-block rounded-xl bg-brand-600 px-4 py-2 font-semibold text-white">Importar extrato</a>
    </div>

    <ul th:unless="${#lists.isEmpty(batches)}" class="space-y-3">
        <li th:each="b : ${batches}">
            <a th:href="@{/imports/{id}(id=${b.id})}"
               class="block rounded-3xl bg-white p-4 shadow-sm ring-1 ring-slate-200 hover:ring-brand-500 dark:bg-slate-900 dark:ring-slate-800">
                <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                        <p class="truncate font-medium" th:text="${b.fileName}">extrato.ofx</p>
                        <p class="text-xs text-slate-500 dark:text-slate-400" th:text="|${b.source} · ${@fmt.dateTime(b.createdAt)}|">OFX · 26/10/2026</p>
                    </div>
                    <span class="shrink-0 rounded-full px-2.5 py-1 text-xs font-medium"
                          th:classappend="${b.status.name() == 'IMPORTED'} ? 'bg-brand-50 text-brand-700 dark:bg-brand-700/30 dark:text-emerald-300'
                                          : (${b.status.name() == 'PREVIEW'} ? 'bg-amber-50 text-amber-800 dark:bg-amber-900/40 dark:text-amber-200'
                                          : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300')"
                          th:text="${b.status.name() == 'IMPORTED'} ? 'Importado' : (${b.status.name() == 'PREVIEW'} ? 'Aguardando' : 'Cancelado')">Importado</span>
                </div>
                <p class="mt-2 text-xs text-slate-600 dark:text-slate-300"
                   th:text="|${b.totalRows} linhas · ${b.newRows} novas · ${b.duplicateRows} duplicadas · ${b.errorRows} com erro|
                            + (${b.status.name() == 'IMPORTED'} ? | · ${b.importedRows} enviadas| : '')">10 linhas</p>
            </a>
        </li>
    </ul>
</main>
</body>
</html>
