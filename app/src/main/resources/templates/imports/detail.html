<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Import</title>
</head>
<body>
<main layout:fragment="content" class="flex-1 px-4 pb-28 safe-top">
    <header class="pt-6 pb-4">
        <h1 class="text-xl font-semibold" th:text="${batch.inPreview()} ? 'Revisar import' : 'Detalhes do import'">Revisar import</h1>
    </header>

    <div th:replace="~{fragments/automation :: tabs('history')}"></div>

    <section th:replace="~{imports/preview :: result}"></section>
</main>
</body>
</html>
