<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Nova senha</title>
</head>
<body>
<main layout:fragment="content" class="flex flex-1 flex-col justify-center px-6 safe-top">
    <h1 class="text-2xl font-semibold">Nova senha</h1>

    <div th:unless="${valid}">
        <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Este link venceu ou já foi usado.</p>
        <a th:href="@{/forgot-password}" class="mt-6 inline-block rounded-xl bg-brand-600 px-6 py-3 font-semibold text-white">Pedir outro link</a>
    </div>

    <form th:if="${valid}" th:action="@{/reset-password}" method="post" class="mt-6 space-y-3">
        <input type="hidden" name="token" th:value="${token}">
        <label class="block">
            <span class="text-sm font-medium">Nova senha</span>
            <input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required autofocus
                   class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-base outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 dark:border-slate-700 dark:bg-slate-900"
                   th:classappend="${error} ? 'border-red-500!'">
            <span th:if="${error}" th:text="${error}" class="mt-1 block text-sm text-red-600 dark:text-red-400">erro</span>
        </label>
        <button type="submit" class="w-full rounded-xl bg-brand-600 py-3 font-semibold text-white active:bg-brand-700">Salvar nova senha</button>
    </form>
</main>
</body>
</html>
