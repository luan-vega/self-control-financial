<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Esqueci minha senha</title>
</head>
<body>
<main layout:fragment="content" class="flex flex-1 flex-col justify-center px-6 safe-top">
    <h1 class="text-2xl font-semibold">Esqueci minha senha</h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Enviamos um link para você escolher uma nova senha.</p>

    <div th:if="${sent}" role="status" class="mt-6 rounded-xl bg-brand-50 p-3 text-sm text-brand-700 dark:bg-brand-700/20 dark:text-emerald-200">
        Se existir uma conta com esse e-mail, o link chega em alguns minutos. Ele vale por 1 hora.
    </div>

    <form th:unless="${sent}" th:action="@{/forgot-password}" method="post" class="mt-6 space-y-3">
        <label class="block">
            <span class="text-sm font-medium">E-mail</span>
            <input type="email" name="email" autocomplete="email" required autofocus
                   class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-base outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 dark:border-slate-700 dark:bg-slate-900">
        </label>
        <button type="submit" class="w-full rounded-xl bg-brand-600 py-3 font-semibold text-white active:bg-brand-700">Enviar link</button>
    </form>

    <p class="mt-8 text-center text-sm"><a th:href="@{/login}" class="font-semibold text-brand-700 dark:text-emerald-300">Voltar para o login</a></p>
</main>
</body>
</html>
