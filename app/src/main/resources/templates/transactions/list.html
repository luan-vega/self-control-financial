<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Extrato</title>
</head>
<body>
<main layout:fragment="content" class="flex-1 px-4 pb-28 safe-top">
    <header class="flex items-center justify-between pt-6 pb-4">
        <h1 class="text-xl font-semibold">Extrato</h1>
        <div class="flex gap-1 text-sm font-medium">
            <a th:href="@{/imports/new}" class="rounded-full px-3 py-1.5 text-brand-600 hover:bg-brand-50 dark:text-brand-500 dark:hover:bg-slate-800">Importar</a>
            <a th:href="@{/inbox}" class="rounded-full px-3 py-1.5 text-brand-600 hover:bg-brand-50 dark:text-brand-500 dark:hover:bg-slate-800">Caixa de entrada</a>
        </div>
    </header>

    <!-- Recarrega sozinho quando um lançamento é excluído (evento transactions-changed) -->
    <section id="statement" th:fragment="statement" class="space-y-5"
             th:hx-get="@{/transactions(month=${month},categoryId=${categoryId})}"
             hx-trigger="transactions-changed from:body" hx-target="this" hx-swap="outerHTML">
        <div class="flex items-center justify-between">
            <button type="button" class="grid size-9 place-items-center rounded-full text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-800"
                    aria-label="Mês anterior"
                    th:hx-get="@{/transactions(month=${month.minusMonths(1)},categoryId=${categoryId})}"
                    hx-target="#statement" hx-swap="outerHTML" hx-push-url="true">
                <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <h2 class="font-medium" th:text="${@fmt.month(month)}">Outubro de 2026</h2>
            <button type="button" class="grid size-9 place-items-center rounded-full text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-800"
                    aria-label="Próximo mês"
                    th:hx-get="@{/transactions(month=${month.plusMonths(1)},categoryId=${categoryId})}"
                    hx-target="#statement" hx-swap="outerHTML" hx-push-url="true">
                <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
        </div>

        <form th:hx-get="@{/transactions}" hx-trigger="change" hx-target="#statement" hx-swap="outerHTML" hx-push-url="true">
            <input type="hidden" name="month" th:value="${month}">
            <label class="sr-only" for="filter-category">Categoria</label>
            <select id="filter-category" name="categoryId"
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm dark:border-slate-700 dark:bg-slate-900">
                <option value="">Todas as categorias</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                        th:selected="${c.id == categoryId}">Mercado</option>
            </select>
        </form>

        <div th:if="${balance != null}" class="grid grid-cols-3 gap-2 text-center text-xs">
            <div class="rounded-2xl bg-white p-3 ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
                <p class="text-slate-500 dark:text-slate-400">Receitas</p>
                <p class="money mt-0.5 text-sm font-semibold text-income dark:text-emerald-400" th:text="${@fmt.money(balance.income())}">R$ 0,00</p>
            </div>
            <div class="rounded-2xl bg-white p-3 ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
                <p class="text-slate-500 dark:text-slate-400">Despesas</p>
                <p class="money mt-0.5 text-sm font-semibold" th:text="${@fmt.money(balance.expenses())}">R$ 0,00</p>
            </div>
            <div class="rounded-2xl bg-white p-3 ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
                <p class="text-slate-500 dark:text-slate-400">Saldo</p>
                <p class="money mt-0.5 text-sm font-semibold"
                   th:classappend="${balance.net().isNegative()} ? 'text-expense dark:text-red-400'"
                   th:text="${@fmt.money(balance.net())}">R$ 0,00</p>
            </div>
        </div>

        <div class="rounded-3xl bg-white px-5 py-2 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
            <div th:if="${#lists.isEmpty(entries)}" class="py-10 text-center">
                <p class="text-sm text-slate-500 dark:text-slate-400">Nenhum lançamento neste mês.</p>
                <button type="button" class="mt-3 rounded-xl bg-brand-600 px-4 py-2 text-sm font-semibold text-white"
                        th:hx-get="@{/transactions/new}" hx-target="#modal" hx-swap="innerHTML">
                    Adicionar lançamento
                </button>
            </div>
            <ul th:unless="${#lists.isEmpty(entries)}">
                <th:block th:each="e, it : ${entries}">
                    <li th:if="${it.first or entries[it.index - 1].transaction.occurredOn != e.transaction.occurredOn}"
                        class="pt-4 pb-1 text-xs font-semibold tracking-wide text-slate-500 uppercase dark:text-slate-400"
                        th:text="${@fmt.fullDay(e.transaction.occurredOn)}">Sexta, 10 de outubro</li>
                    <li th:replace="~{fragments/charts :: entry(${e}, true)}"></li>
                </th:block>
            </ul>
        </div>
    </section>
</main>
</body>
</html>
