<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Configurações</title>
</head>
<body>
<main layout:fragment="content" class="flex-1 px-4 pb-28 safe-top">
    <header class="pt-6 pb-4">
        <h1 class="text-xl font-semibold">Configurações</h1>
    </header>

    <a th:href="@{/settings/profile}" class="flex items-center gap-3 rounded-3xl bg-white p-4 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
        <span th:replace="~{fragments/ui :: avatar(${profile}, 'size-12 text-lg')}"></span>
        <span class="min-w-0 flex-1">
            <span class="flex items-center gap-2">
                <span class="truncate font-medium" th:text="${profile.name}">Nome</span>
                <span th:replace="~{fragments/ui :: plan(${subscription})}"></span>
            </span>
            <span class="block truncate text-sm text-slate-500 dark:text-slate-400" th:text="${profile.email}">email</span>
        </span>
        <svg class="size-5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </a>

    <nav class="mt-4 divide-y divide-slate-100 rounded-3xl bg-white shadow-sm ring-1 ring-slate-200 dark:divide-slate-800 dark:bg-slate-900 dark:ring-slate-800" aria-label="Configurações">
        <a th:href="@{/billing}" class="flex items-center gap-3 px-4 py-3.5">
            <svg class="size-5 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
            <span class="flex-1">Plano e cobrança</span>
        </a>
        <a th:href="@{/settings/api-keys}" class="flex items-center gap-3 px-4 py-3.5">
            <svg class="size-5 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/></svg>
            <span class="flex-1">Chaves de API</span>
        </a>
        <a th:href="@{/settings/shortcut}" class="flex items-center gap-3 px-4 py-3.5">
            <svg class="size-5 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
            <span class="flex-1">Atalho do iPhone</span>
        </a>
        <a th:if="${profile.admin()}" th:href="@{/admin/users}" class="flex items-center gap-3 px-4 py-3.5">
            <svg class="size-5 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span class="flex-1">Administração</span>
        </a>
    </nav>

    <nav class="mt-4 divide-y divide-slate-100 rounded-3xl bg-white text-sm shadow-sm ring-1 ring-slate-200 dark:divide-slate-800 dark:bg-slate-900 dark:ring-slate-800" aria-label="Sobre">
        <a th:href="@{/docs}" class="block px-4 py-3">Documentação da API</a>
        <a th:href="@{/legal/terms}" class="block px-4 py-3">Termos de Uso</a>
        <a th:href="@{/legal/privacy}" class="block px-4 py-3">Política de Privacidade</a>
    </nav>

    <form th:action="@{/logout}" method="post" class="mt-4">
        <button type="submit" class="w-full rounded-3xl bg-white py-3.5 font-medium text-red-600 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:text-red-400 dark:ring-slate-800">Sair</button>
    </form>
</main>
</body>
</html>
