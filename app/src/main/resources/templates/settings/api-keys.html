<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Chaves de API</title>
</head>
<body>
<main layout:fragment="content" class="flex-1 px-4 pb-28 safe-top">
    <header th:replace="~{fragments/ui :: back('Chaves de API', 'Acesse seus dados por apps e integrações.', '/settings')}"></header>

    <div class="space-y-4">
        <section id="api-keys" th:fragment="keys" class="space-y-4">
            <div th:if="${created}" class="space-y-2 rounded-3xl bg-amber-50 p-5 dark:bg-amber-900/30">
                <p class="text-sm font-medium text-amber-900 dark:text-amber-100">
                    Chave <strong th:text="${created.key.name}">nome</strong> criada. Copie agora: por segurança ela não aparece de novo.
                </p>
                <div class="flex gap-2">
                    <input id="new-key" type="text" readonly th:value="${created.secret}" aria-label="Chave de API"
                           class="min-w-0 flex-1 rounded-xl border border-amber-300 bg-white px-3 py-2 font-mono text-xs dark:border-amber-700 dark:bg-slate-950">
                    <button type="button" data-copy="#new-key" class="rounded-xl bg-brand-600 px-4 font-semibold text-white">Copiar</button>
                </div>
            </div>

            <form th:hx-post="@{/settings/api-keys}" hx-target="#api-keys" hx-swap="outerHTML"
                  th:action="@{/settings/api-keys}" method="post"
                  class="space-y-3 rounded-3xl bg-white p-5 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
                <h2 class="font-medium">Nova chave</h2>
                <label class="block">
                    <span class="sr-only">Nome</span>
                    <input type="text" name="name" maxlength="60" placeholder="Nome, ex.: App do iPhone" required
                           class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-base outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 dark:border-slate-700 dark:bg-slate-950">
                </label>
                <label class="flex items-center gap-2 text-sm">
                    <input type="checkbox" name="readOnly" value="true" class="size-4 accent-brand-600">
                    Somente leitura (só consulta, não altera nada)
                </label>
                <p th:if="${error}" th:text="${error}" role="alert" class="text-sm text-red-600 dark:text-red-400">erro</p>
                <button type="submit" class="w-full rounded-xl bg-brand-600 py-3 font-semibold text-white active:bg-brand-700">Criar chave</button>
            </form>

            <div class="rounded-3xl bg-white px-4 py-2 shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
                <p th:if="${#lists.isEmpty(keys)}" class="py-3 text-sm text-slate-500 dark:text-slate-400">Nenhuma chave ativa.</p>
                <ul class="divide-y divide-slate-100 dark:divide-slate-800">
                    <li th:each="k : ${keys}" class="flex items-center gap-3 py-3">
                        <div class="min-w-0 flex-1">
                            <p class="flex items-center gap-2">
                                <span class="truncate font-medium" th:text="${k.name}">nome</span>
                                <span th:if="${k.readOnly}" class="rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-semibold text-slate-600 dark:bg-slate-800 dark:text-slate-300">leitura</span>
                            </p>
                            <p class="text-xs text-slate-500 dark:text-slate-400">
                                <code class="font-mono" th:text="|scfk_…${k.hint}|">scfk_…abcd</code> ·
                                <span th:text="${k.lastUsedAt != null} ? |usada ${@fmt.dateTime(k.lastUsedAt)}| : 'nunca usada'">nunca usada</span>
                            </p>
                        </div>
                        <button type="button" class="rounded-xl px-3 py-1.5 text-sm font-medium text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950"
                                th:hx-delete="@{/settings/api-keys/{id}(id=${k.id})}" hx-target="#api-keys" hx-swap="outerHTML"
                                th:attr="hx-confirm=|Revogar a chave ${k.name}? Quem usa essa chave perde o acesso.|">Revogar</button>
                    </li>
                </ul>
            </div>
        </section>

        <section class="rounded-3xl bg-white p-5 text-sm shadow-sm ring-1 ring-slate-200 dark:bg-slate-900 dark:ring-slate-800">
            <h2 class="font-medium">Como usar</h2>
            <p class="mt-2 text-slate-600 dark:text-slate-300">Envie a chave no header <code>Authorization</code>. Limite de 100 requisições por minuto.</p>
            <pre class="mt-3 overflow-x-auto rounded-xl bg-slate-100 p-3 text-xs dark:bg-slate-800" th:text="|curl -H &quot;Authorization: Bearer scfk_...&quot; ${apiBase}/me|">curl</pre>
            <a th:href="${docsUrl}" class="mt-3 inline-block font-semibold text-brand-700 dark:text-emerald-300">Ver a documentação completa</a>
        </section>
    </div>
</main>
</body>
</html>
