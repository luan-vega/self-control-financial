<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Auditoria</title>
</head>
<body>
<main layout:fragment="content" class="flex-1 px-4 pb-28 safe-top">
    <header th:replace="~{fragments/ui :: back('Auditoria', ${filtered != null} ? ${filtered.email} : 'Últimos 200 eventos', '/admin/users')}"></header>

    <ul class="divide-y divide-slate-100 rounded-3xl bg-white px-4 shadow-sm ring-1 ring-slate-200 dark:divide-slate-800 dark:bg-slate-900 dark:ring-slate-800">
        <li th:if="${#lists.isEmpty(events)}" class="py-4 text-sm text-slate-500">Nenhum evento.</li>
        <li th:each="e : ${events}" class="py-3 text-sm">
            <div class="flex items-baseline justify-between gap-2">
                <code class="font-mono text-xs font-semibold" th:text="${e.action}">auth.login</code>
                <span class="shrink-0 text-xs text-slate-400" th:text="${@fmt.dateTime(e.occurredAt)}">data</span>
            </div>
            <p class="mt-0.5 truncate text-slate-600 dark:text-slate-300">
                <span th:text="${e.actorEmail != null} ? ${e.actorEmail} : 'anônimo/sistema'">quem</span>
                <span th:if="${e.subjectEmail != null and e.subjectEmail != e.actorEmail}" th:text="|→ ${e.subjectEmail}|"></span>
            </p>
            <p class="truncate text-xs text-slate-400">
                <span th:text="${e.channel}">WEB</span>
                <span th:if="${e.ip != null}" th:text="| · ${e.ip}|"></span>
                <span th:if="${e.targetType != null}" th:text="| · ${e.targetType}|"></span>
                <span th:if="${e.details != '{}'}" class="font-mono" th:text="| · ${e.details}|"></span>
            </p>
        </li>
    </ul>
</main>
</body>
</html>
