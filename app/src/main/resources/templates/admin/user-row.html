<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Linha de um usuário na lista do admin; também devolvida sozinha ao ativar/desativar (HTMX) -->
<ul>
    <li th:fragment="row" th:id="|user-${u.id}|" class="py-3">
        <div class="flex items-start gap-3">
            <div class="min-w-0 flex-1">
                <p class="flex flex-wrap items-center gap-1.5">
                    <span class="truncate font-medium" th:classappend="${!u.active} ? 'text-slate-400 line-through'" th:text="${u.name}">Nome</span>
                    <span th:if="${u.role.name() == 'ADMIN'}" class="rounded-full bg-slate-900 px-1.5 py-0.5 text-[10px] font-semibold text-white dark:bg-slate-100 dark:text-slate-900">admin</span>
                    <span th:if="${u.plan == 'PRO'}" class="rounded-full bg-brand-600 px-1.5 py-0.5 text-[10px] font-semibold text-white">Pro</span>
                    <span th:unless="${u.active}" class="rounded-full bg-red-50 px-1.5 py-0.5 text-[10px] font-semibold text-red-700 dark:bg-red-950 dark:text-red-200">desativada</span>
                </p>
                <p class="truncate text-sm text-slate-500 dark:text-slate-400">
                    <span th:text="${u.email}">email</span><span th:unless="${u.emailVerified}"> · não confirmado</span>
                </p>
                <p class="text-xs text-slate-400">
                    Desde <span th:text="${@fmt.dateTime(u.createdAt)}">data</span>
                    <span th:if="${u.lastLoginAt != null}" th:text="| · último acesso ${@fmt.dateTime(u.lastLoginAt)}|"></span>
                </p>
                <p th:if="${rowError}" th:text="${rowError}" role="alert" class="mt-1 text-sm text-red-600 dark:text-red-400">erro</p>
            </div>
            <div class="flex shrink-0 flex-col items-end gap-1">
                <button type="button" class="rounded-lg px-2 py-1 text-xs font-medium"
                        th:classappend="${u.active} ? 'text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950' : 'text-brand-700 hover:bg-brand-50 dark:text-emerald-300'"
                        th:hx-post="@{/admin/users/{id}/active(id=${u.id},active=${!u.active})}"
                        th:hx-target="|#user-${u.id}|" hx-swap="outerHTML"
                        th:attr="hx-confirm=${u.active} ? |Desativar ${u.email}? A pessoa sai de todas as sessões e as chaves param de funcionar.| : null"
                        th:text="${u.active} ? 'Desativar' : 'Ativar'">Desativar</button>
                <a th:href="@{/admin/audit(user=${u.id})}" class="px-2 text-xs text-slate-500">Atividade</a>
            </div>
        </div>
    </li>
</ul>
</body>
</html>
