<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Termos de Uso</title>
</head>
<body>
<main layout:fragment="content" class="flex flex-1 flex-col justify-center px-6 safe-top">
    <h1 class="text-2xl font-semibold">Antes de continuar</h1>
    <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">
        Para usar o Self Control, leia e aceite os
        <a th:href="@{/legal/terms}" class="font-medium text-brand-700 underline dark:text-emerald-300">Termos de Uso</a>
        e a <a th:href="@{/legal/privacy}" class="font-medium text-brand-700 underline dark:text-emerald-300">Política de Privacidade</a>.
    </p>
    <form th:action="@{/legal/accept}" method="post" class="mt-6 space-y-4">
        <label class="flex items-start gap-3 text-sm">
            <input type="checkbox" name="acceptTerms" value="true" class="mt-0.5 size-5 shrink-0 accent-brand-600">
            <span>Li e aceito os Termos de Uso e a Política de Privacidade.</span>
        </label>
        <p th:if="${error}" th:text="${error}" class="text-sm text-red-600 dark:text-red-400">erro</p>
        <button type="submit" class="w-full rounded-xl bg-brand-600 py-3 font-semibold text-white active:bg-brand-700">Continuar</button>
    </form>
    <form th:action="@{/logout}" method="post" class="mt-3">
        <button type="submit" class="w-full rounded-xl py-3 text-sm font-medium text-slate-500">Sair</button>
    </form>
</main>
</body>
</html>
