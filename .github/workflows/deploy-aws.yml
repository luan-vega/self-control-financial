name: Deploy AWS

# Deploy automático na EC2 (docs/deploy-aws.md) sempre que o Release publica uma imagem nova da main.
# Também roda à mão (Actions → Deploy AWS → Run workflow), com uma tag para rollback.
#
# Sem chave da AWS nem SSH no GitHub: o job assume um papel do IAM via OIDC e manda o comando para a
# EC2 pelo SSM Run Command. Configure no environment "production" (Settings → Environments):
#   variáveis AWS_REGION, AWS_DEPLOY_ROLE_ARN, EC2_INSTANCE_ID (saídas do Terraform) e,
#   opcional, APP_PUBLIC_URL para o teste final por HTTPS.
# Enquanto AWS_DEPLOY_ROLE_ARN não existir, o job é pulado.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da imagem (sha completo do commit, versão ou latest). Vazio = commit atual da main."
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Confere a configuração
        id: config
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] || [ -z "$INSTANCE_ID" ] || [ -z "$AWS_REGION" ]; then
            echo "::notice::Deploy AWS não configurado (variáveis do environment production). Pulando."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          # Os arquivos do servidor vão na mesma versão da imagem
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Envia os arquivos e troca a versão na EC2
        if: steps.config.outputs.enabled == 'true'
        run: |
          # deploy/aws/server vai compactado no próprio comando (poucos KB), sem bucket nem SSH
          bundle=$(tar -C deploy/aws/server -czf - . | base64 -w0)
          jq -n --arg bundle "$bundle" --arg tag "$TAG" '{
            commands: [
              "set -eu",
              "d=$(mktemp -d)",
              "echo \($bundle) | base64 -d | tar -xz -C \"$d\"",
              "bash \"$d/scripts/install.sh\"",
              "rm -rf \"$d\"",
              "/opt/self-control/scripts/deploy.sh \($tag)"
            ],
            executionTimeout: ["900"]
          }' > params.json

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${TAG:0:40}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          # Espera até 15 min (o waiter do CLI desiste em 100 s, pouco para baixar a imagem e subir a JVM)
          status=Pending
          for _ in $(seq 1 90); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "Status: $status"
          [ "$status" = "Success" ]

      - name: Confere pelo HTTPS
        if: steps.config.outputs.enabled == 'true' && vars.APP_PUBLIC_URL != ''
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 10 "${{ vars.APP_PUBLIC_URL }}/actuator/health/readiness"; then
              echo; echo "ok"; exit 0
            fi
            sleep 5
          done
          exit 1
