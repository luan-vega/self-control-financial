name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Testes de integração usam Testcontainers (Docker já vem no runner do GitHub)
      - name: Build e testes
        run: ./mvnw -B verify

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
