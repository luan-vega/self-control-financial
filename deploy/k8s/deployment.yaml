apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-control-financial
  labels:
    app: self-control-financial
spec:
  # Uma réplica: rate limit e cache são em memória. Para escalar, ver docs/deployment.md.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: self-control-financial
  template:
    metadata:
      labels:
        app: self-control-financial
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/luan-vega/self-control-financial
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: self-control-financial
            - secretRef:
                name: self-control-financial
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          lifecycle:
            # Dá tempo do Service tirar o pod da rotação antes do desligamento gracioso
            preStop:
              sleep:
                seconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
