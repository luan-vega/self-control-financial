# NÃO aplique este arquivo com valores reais nem faça commit deles. Crie o Secret direto no cluster:
#
#   kubectl -n self-control-financial create secret generic self-control-financial \
#     --from-literal=DB_URL=jdbc:postgresql://HOST:5432/selfcontrol \
#     --from-literal=DB_USER=selfcontrol --from-literal=DB_PASSWORD=... \
#     --from-literal=STRIPE_SECRET_KEY=sk_live_... --from-literal=STRIPE_WEBHOOK_SECRET=whsec_... \
#     --from-literal=STRIPE_PRICE_ID=price_... \
#     --from-literal=GOOGLE_CLIENT_ID=... --from-literal=GOOGLE_CLIENT_SECRET=... \
#     --from-literal=ADMIN_EMAILS=voce@exemplo.com
#
# Ou use um gerenciador (External Secrets, Sealed Secrets, SOPS). Este arquivo só documenta as chaves.
apiVersion: v1
kind: Secret
metadata:
  name: self-control-financial
type: Opaque
stringData:
  DB_URL: jdbc:postgresql://postgres:5432/selfcontrol
  DB_USER: selfcontrol
  DB_PASSWORD: trocar
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_PRICE_ID: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  ADMIN_EMAILS: ""
