# nginx do host: TLS (Let's Encrypt) e proxy para a app em 127.0.0.1:8080.
# __DOMAIN__ é trocado pelo domínio em setup-https.sh / install.sh.
# A app confia no X-Forwarded-Proto (server.forward-headers-strategy=framework) e recusa HTTP no perfil prod.

# Limite grosso por IP antes de chegar à app (o fino, por usuário, fica na app)
limit_req_zone $binary_remote_addr zone=self_control_ip:10m rate=20r/s;
limit_req_status 429;

log_format self_control_json escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","status":$status,'
  '"bytes":$body_bytes_sent,"duration":$request_time,"upstream_duration":"$upstream_response_time",'
  '"user_agent":"$http_user_agent"}';

upstream self_control_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP: desafio do Let's Encrypt (renovação) e redirecionamento para HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/self-control/nginx/access.log self_control_json;
    error_log  /var/log/self-control/nginx/error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    # Sintaxe do nginx 1.24 (Ubuntu 24.04); no 1.25+ seria "http2 on;"
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # Perfil "intermediate" da Mozilla
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/self-control/nginx/access.log self_control_json;
    error_log  /var/log/self-control/nginx/error.log warn;

    # Upload de OFX/CSV: até 5 MB (spring.servlet.multipart.max-request-size=6MB)
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    location / {
        limit_req zone=self_control_ip burst=40 nodelay;

        proxy_pass http://self_control_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Durante o deploy (app reiniciando) mostra uma mensagem em vez do 502 cru
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/self-control;
        internal;
    }
}
