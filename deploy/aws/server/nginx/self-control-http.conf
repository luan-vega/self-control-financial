# Configuração provisória (antes do certificado): só responde o desafio do Let's Encrypt.
# setup-https.sh instala esta, pede o certificado e troca por self-control.conf.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503 "Configurando HTTPS\n";
    }
}
