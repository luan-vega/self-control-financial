# /etc/logrotate.d/self-control. Os logs da app (app/) o próprio Spring Boot gira.
/var/log/self-control/nginx/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        [ -s /run/nginx.pid ] && kill -USR1 "$(cat /run/nginx.pid)"
    endscript
}

/var/log/self-control/deploy.log {
    monthly
    rotate 6
    missingok
    notifempty
    compress
}
